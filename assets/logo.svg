<?xml version="1.0" encoding="UTF-8"?>
<!-- SNS Biz — primary logo lockup (icon + wordmark) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" role="img" aria-label="SNS Biz">
  <title>SNS Biz</title>

  <!-- Icon: navy rounded square with gold serif SNS monogram and rule -->
  <g id="icon" transform="translate(0, 7)">
    <rect x="0" y="0" width="96" height="96" rx="8" ry="8" fill="#1a2b4e"/>
    <rect x="6" y="6" width="84" height="84" rx="5" ry="5" fill="none" stroke="#b89b5e" stroke-width="1.2" opacity="0.55"/>
    <text x="48" y="52" text-anchor="middle"
          font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
          font-weight="700" font-size="28" letter-spacing="2" fill="#b89b5e">SNS</text>
    <line x1="32" y1="64" x2="64" y2="64" stroke="#b89b5e" stroke-width="1.5"/>
    <text x="48" y="78" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="9" letter-spacing="2.5" fill="#b89b5e">BIZ</text>
  </g>

  <!-- Wordmark: 3 separate text elements, no letter-spacing (natural tracking) -->
  <text x="122" y="64"
        font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
        font-weight="700" font-size="44" fill="#1a2b4e">SNS</text>
  <text x="222" y="64"
        font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
        font-weight="700" font-size="44" fill="#b89b5e">·</text>
  <text x="244" y="64"
        font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
        font-weight="700" font-size="44" fill="#1a2b4e">BIZ</text>

  <!-- Tagline -->
  <text x="124" y="92"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="500" font-size="10" letter-spacing="3" fill="#6b6b6b">TAX  ·  ACCOUNTING  ·  CONSULTING</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- SNS Biz — reverse logo (for use on dark/navy backgrounds, e.g. footer) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" role="img" aria-label="SNS Biz">
  <title>SNS Biz</title>

  <!-- Icon: light cream square with navy SNS, gold accents -->
  <g id="icon" transform="translate(0, 7)">
    <rect x="0" y="0" width="96" height="96" rx="8" ry="8" fill="#ffffff"/>
    <rect x="6" y="6" width="84" height="84" rx="5" ry="5" fill="none" stroke="#b89b5e" stroke-width="1.2"/>
    <text x="48" y="52" text-anchor="middle"
          font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
          font-weight="700" font-size="28" letter-spacing="2" fill="#1a2b4e">SNS</text>
    <line x1="32" y1="64" x2="64" y2="64" stroke="#b89b5e" stroke-width="1.5"/>
    <text x="48" y="78" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="9" letter-spacing="2.5" fill="#1a2b4e">BIZ</text>
  </g>

  <!-- Wordmark in white + gold for dark background -->
  <text x="122" y="64"
        font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
        font-weight="700" font-size="44" fill="#ffffff">SNS</text>
  <text x="222" y="64"
        font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
        font-weight="700" font-size="44" fill="#b89b5e">·</text>
  <text x="244" y="64"
        font-family="'Times New Roman', 'Liberation Serif', Georgia, serif"
        font-weight="700" font-size="44" fill="#ffffff">BIZ</text>

  <!-- Tagline -->
  <text x="124" y="92"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="500" font-size="10" letter-spacing="3"
        fill="rgba(255,255,255,0.7)">TAX  ·  ACCOUNTING  ·  CONSULTING</text>
</svg>
